name: CI

# El CI corre en cada pull request y cuando se publica una etiqueta de
# versión. En un PR es el required check de `main` («tests and gates»): sin
# él la protección de la rama bloquea el merge para siempre, porque un check
# que nunca reporta no aprueba nada. Para comprobar una rama sin abrir PR,
# `cargo test --workspace` y `cargo clippy --workspace --all-targets` en
# local; la etiqueta es la que decide si el artefacto sale.
on:
  pull_request:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests and gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the system dependencies (RNF2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # El plano es una app Svelte (`crates/gx-app/frontend`) y `tauri::
      # generate_context!()` embebe `frontend/dist` al compilar: el build de
      # Vite tiene que correr ANTES de cualquier `cargo build`/`cargo test`.
      # Sin este paso el workspace no compila en un checkout limpio
      # (frontend-consolidacion, L3).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gx-app/frontend/package-lock.json

      - name: Frontend bundle (Vite)
        working-directory: crates/gx-app/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace

      - name: Tests
        run: cargo test --workspace

      # Las seis suites de página que la consolidación retiró dejan su rol de
      # comportamiento en este arnés: las reglas de CONTRACT.md §8 sobre el
      # bundle real, con el puente de Tauri falso, en el Chrome del runner
      # (CONTRACT.md §10, el mapa de cobertura).
      - name: Frontend behavior (parity harness)
        working-directory: crates/gx-app/frontend
        run: |
          chromium="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chromium" ]; then
            echo "::error::the parity harness needs a Chromium on PATH"
            exit 1
          fi
          node tools/parity.mjs --chromium "$chromium"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # PRD §14.3 y §7.3: el mismo JSON tiene que dar los mismos bytes (O8) y
      # el dibujo tiene que entrar en el presupuesto de RNF1-ter. El test
      # imprime el hash de cada golden para que el log del CI muestre qué
      # cambió sin abrir el diff.
      - name: Golden SVG and byte budget (O8, RNF1-ter)
        run: cargo test -p gx-app --test golden_svg -- --nocapture

      # RNF10: doce diagramas de 300 nodos viven a la vez bajo el techo de
      # 250 MB. Se mide en release porque en debug no significa nada.
      - name: Memory ceiling (RNF10)
        run: cargo test --release -p gx-app --test rnf10 -- --ignored --nocapture

      # PRD §9.1: the dependency matrix is a gate, not a convention.
      - name: Dependency gate (PRD §9.1)
        run: |
          set -euo pipefail
          fail=0
          check() {
            crate="$1"; shift
            for forbidden in "$@"; do
              if cargo tree -p "$crate" --edges normal | grep -q "$forbidden"; then
                echo "::error::$crate must not depend on $forbidden"
                fail=1
              fi
            done
          }
          check gx-core gx-kinds gx-layout gx-render-svg gx-mcp gx-app
          check gx-kinds gx-layout gx-render-svg gx-mcp gx-app
          check gx-layout gx-kinds gx-render-svg gx-mcp gx-app
          check gx-render-svg gx-layout gx-kinds gx-mcp gx-app
          # gx-mcp reaches a kind only through the registry (PRD §9.1):
          # it must not match on the name of a kind.
          if grep -rnE 'match +[^=]*"(graph|er|flowchart|sequence|class|state|component|dataflow|block|api|trust|deployment|network|neural|tree|mindmap|orgchart|sankey|gitgraph|timeline|swimlane|activity|journey|gantt)"' crates/gx-mcp/src crates/gx-app/src; then
            echo "::error::gx-mcp must not match on kind names"
            fail=1
          fi
          exit "$fail"

      # RNF1-quater: the binary budget, measured on the release build. Since
      # the single-binary decision (2026-11-07) the default build ships every
      # book language, and the declared ceiling is 48 MB (closed by T6 with
      # the twenty-grammar measurement: 45,806,232 B).
      - name: Binary budget (RNF1-quater)
        run: |
          cargo build --release --bin graphium
          size=$(du -b target/release/graphium | cut -f1)
          echo "binary size: $size bytes"
          if [ "$size" -gt 50300000 ]; then
            echo "::error::the binary is over the 50.3 MB budget"
            exit 1
          fi

      # The layout capability matrix of dagre (PRD §8.4) runs with the
      # ordinary test suite; the timing matrix RNF1-bis is measured with
      # the ignored test.
      - name: Layout capability matrix (dagre)
        run: cargo test -p gx-layout -- --nocapture

  matrix:
    name: layout matrix RNF1-bis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure RNF1-bis
        run: |
          cargo test --release -p gx-layout -- --ignored --nocapture | tee rnf1-bis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rnf1-bis
          path: rnf1-bis.txt
