[package]
name = "gx-index"
description = "The book of the project: a SQLite + FTS5 index of the symbols of a worktree (F9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ignore = { workspace = true }
notify = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tree-sitter = { workspace = true }
# The grammars are optional on purpose (T4/C3, the lever of RNF1-quater): each
# one is a feature, all five are on by default, so a build that does not need a
# language pays neither its code nor its grammar in the binary.
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
# T3 Batch 1 (S2/S4): the grammars of the languages after the five of C2. The
# versions are local to this manifest — the crate that owns the grammars owns
# their versions — and every one of them is OFF by default: the default binary
# keeps the five languages of C2 and does not grow (RNF1-quater).
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
# T3 Batch 2 (S2/S4): PHP, Ruby, SQL and Shell, OFF by default like Batch 1.
# SQL comes from `tree-sitter-sequel` — the maintained SQL grammar at the ABI of
# the engine (tree-sitter-language 0.1). The crate called `tree-sitter-sql` on
# crates.io stopped at 0.0.2 (2021, built against tree-sitter 0.19) and cannot
# be loaded by this engine; `lang-sql` names the language, not the crate.
tree-sitter-php = { version = "0.25.1", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
# T3 Batch 3 (S2/S4): Swift, Kotlin and Dart. The crate called
# `tree-sitter-kotlin` on crates.io stopped at 0.3.8 and takes tree-sitter
# `<0.23` as a *normal* dependency, so its `Language` cannot be handed to this
# engine; Kotlin comes from `tree-sitter-kotlin-ng`, the same
# tree-sitter-grammars grammar published under a free name at the ABI of the
# engine (`tree-sitter-language` 0.1). `lang-kotlin` names the language, not the
# crate (the rule of L8's SQL).
tree-sitter-swift = { version = "0.7.4", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-dart = { version = "0.3.0", optional = true }
# T3 Batch 4 (S2/S4): Scala, R, Lua and Zig — the last four languages of the
# twenty of the approved list (L6). All four publish `tree-sitter-language` 0.1
# (the ABI of the engine) and their parsers declare language version 14 or 15,
# so no crate substitution was needed this time (unlike L8's SQL and L10's
# Kotlin). On by default like every other language of the book (L9).
tree-sitter-scala = { version = "0.26.9", optional = true }
tree-sitter-r = { version = "1.3.0", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }

[features]
# Default-on: the book ships the five languages of C2, so existing users see no
# change (T4/C3). A slim build says which ones it wants:
# `--no-default-features --features "lang-rust,lang-typescript"`.
# Single-binary decision (2026-11-07): the default build ships EVERY book
# language, so the user never installs or compiles anything — unused
# grammars are static pages the loader brings in lazily, and a project's
# book only gets chapters for the files it actually has. The features
# remain for slim opt-out builds:
#   `--no-default-features --features "lang-rust,lang-typescript"`.
default = [
  "lang-rust",
  "lang-typescript",
  "lang-python",
  "lang-go",
  "lang-java",
  "lang-javascript",
  "lang-c",
  "lang-cpp",
  "lang-csharp",
  "lang-php",
  "lang-ruby",
  "lang-sql",
  "lang-shell",
  "lang-swift",
  "lang-kotlin",
  "lang-dart",
  "lang-scala",
  "lang-r",
  "lang-lua",
  "lang-zig",
]
lang-rust = ["dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
# T3 Batch 1: JavaScript/JSX, C, C++ and C#, all **off** by default. A build
# that wants them asks: `--features "lang-javascript,lang-c,lang-cpp,lang-csharp"`.
lang-javascript = ["dep:tree-sitter-javascript"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
# T3 Batch 2: PHP, Ruby, SQL and Shell, all **off** by default. A build that
# wants them asks: `--features "lang-php,lang-ruby,lang-sql,lang-shell"`.
lang-php = ["dep:tree-sitter-php"]
lang-ruby = ["dep:tree-sitter-ruby"]
# The grammar crate is `tree-sitter-sequel`; the language is SQL.
lang-sql = ["dep:tree-sitter-sequel"]
lang-shell = ["dep:tree-sitter-bash"]
# T3 Batch 3: Swift, Kotlin and Dart. On by default like every other language
# of the book (the single-binary decision of L9): a slim build still asks for
# the ones it wants. The Kotlin grammar crate is `tree-sitter-kotlin-ng`.
lang-swift = ["dep:tree-sitter-swift"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-dart = ["dep:tree-sitter-dart"]
# T3 Batch 4: Scala, R, Lua and Zig — the last four of the twenty languages of
# the approved list (L6). On by default like every other language of the book
# (the single-binary decision of L9); a slim build still asks for the ones it
# wants.
lang-scala = ["dep:tree-sitter-scala"]
lang-r = ["dep:tree-sitter-r"]
lang-lua = ["dep:tree-sitter-lua"]
lang-zig = ["dep:tree-sitter-zig"]

