<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graphium</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The plan: an infinite surface with a grid. The camera lives here. -->
    <div id="plan" class="plan">
      <div id="diagrams" class="diagrams"></div>
    </div>

    <!-- The panel of the open diagrams (PRD §7 RF26, RF28, S1). It is a
         sibling of the plan, never a child: the wheel and the drag of the
         camera listen on `#plan`, so the panel can never steal them. It is
         built only from `graphium://state` (PRD §8.6.1, S8): the list below
         is empty until Rust says what is open. -->
    <button
      id="panel-toggle"
      class="panel-toggle"
      type="button"
      aria-label="mostrar u ocultar los diagramas abiertos"
      aria-expanded="true"
      aria-controls="panel"
      title="diagramas abiertos"
    >
      ☰
    </button>

    <aside id="panel" class="panel" aria-label="diagramas abiertos">
      <h2 class="panel-title">diagramas abiertos</h2>
      <ul id="panel-list" class="panel-list"></ul>
      <p id="panel-empty" class="panel-empty">sin diagramas abiertos</p>
    </aside>

    <!-- The panel of the sessions (S1, S3, D3), separated from the panel of
         diagrams: its own button sits in the bottom-left corner and its own
         panel opens above it. The fixed row «Todas» and one row per live
         session, with the colour of its family, its label, its project, its
         state and how many diagrams it has. Choosing a row hides the
         diagrams of the other sessions; it never closes them (D5). It is
         built only from `graphium://state`, like the list of diagrams. -->
    <button
      id="sessions-toggle"
      class="sessions-toggle"
      type="button"
      aria-label="mostrar u ocultar las sesiones"
      aria-expanded="false"
      aria-controls="sessions-panel"
      title="sesiones"
    >
      ◉
    </button>

    <aside id="sessions-panel" class="sessions-panel hidden" aria-label="sesiones">
      <h2 class="panel-title">sesiones</h2>
      <div id="session-list" class="session-list" role="group" aria-label="sesiones"></div>
      <p id="session-notice" class="session-notice hidden" role="status"></p>
    </aside>

    <!-- State 1: empty plan. -->
    <div id="empty" class="empty">
      <p class="empty-title">esperando al agente…</p>
      <p class="empty-hint">conectá un cliente MCP y corré <code>graphium mcp-config</code></p>
    </div>

    <!-- State 3: error banner. -->
    <div id="banner" class="banner hidden" role="alert">
      <div class="banner-body">
        <span id="banner-path" class="banner-path"></span>
        <span id="banner-message" class="banner-message"></span>
        <span id="banner-hint" class="banner-hint"></span>
        <span id="banner-extra" class="banner-extra"></span>
      </div>
      <button id="banner-close" class="banner-close" type="button" aria-label="cerrar">×</button>
    </div>

    <!-- State 2: a render in flight. -->
    <div id="ghost" class="ghost hidden">
      <span id="ghost-text">calculando layout…</span>
    </div>

    <!-- The settings of the plan (PRD §7.1 RF25, §8.5.2 RF22, S19).
         The look belongs to the human: the agent never changes it.
         The gear and the panel sit here, outside `#plan`, so the wheel and
         the drag of the camera never see them. -->
    <button
      id="settings-toggle"
      class="settings-toggle"
      type="button"
      aria-label="ajustes del plano"
      aria-expanded="false"
      aria-controls="settings-panel"
      title="ajustes del plano"
    >
      ⚙
    </button>

    <section
      id="settings-panel"
      class="settings-panel hidden"
      role="dialog"
      aria-label="ajustes del plano"
    >
      <div class="settings-head">
        <h2 class="settings-title">ajustes del plano</h2>
        <button id="settings-close" class="settings-close" type="button" aria-label="cerrar los ajustes">
          ×
        </button>
      </div>

      <div class="settings-field">
        <label for="settings-background">fondo</label>
        <input id="settings-background" type="color" />
        <span class="settings-value"></span>
      </div>

      <div class="settings-field">
        <label for="settings-grid-color">grilla</label>
        <input id="settings-grid-color" type="color" />
        <span class="settings-value"></span>
      </div>

      <div class="settings-field">
        <label for="settings-grid-opacity">opacidad</label>
        <input id="settings-grid-opacity" type="range" min="0" max="1" step="0.01" />
        <output id="settings-grid-opacity-value" class="settings-value" for="settings-grid-opacity"></output>
      </div>

      <div class="settings-field">
        <label for="settings-grid-diagonal">separación</label>
        <input id="settings-grid-diagonal" type="range" min="20" max="200" step="1" />
        <output id="settings-grid-diagonal-value" class="settings-value" for="settings-grid-diagonal"></output>
      </div>

      <div class="settings-field">
        <label for="settings-grid-angle">ángulo</label>
        <input id="settings-grid-angle" type="range" min="15" max="75" step="1" />
        <output id="settings-grid-angle-value" class="settings-value" for="settings-grid-angle"></output>
      </div>

      <div class="settings-field">
        <label for="settings-grid-visible">mostrar grilla</label>
        <input id="settings-grid-visible" type="checkbox" />
        <span class="settings-value"></span>
      </div>

      <fieldset class="settings-theme">
        <legend>tema</legend>
        <label class="settings-radio">
          <input type="radio" name="settings-theme" value="dark" />
          oscuro
        </label>
        <label class="settings-radio">
          <input type="radio" name="settings-theme" value="light" />
          claro
        </label>
      </fieldset>

      <div class="settings-presets">
        <button type="button" class="settings-preset" data-preset="plano">plano</button>
        <button type="button" class="settings-preset" data-preset="claro">claro</button>
        <button type="button" class="settings-preset" data-preset="sin grilla">sin grilla</button>
      </div>
    </section>

    <script src="plan.js"></script>
  </body>
</html>
