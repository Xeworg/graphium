[workspace]
resolver = "2"
members = [
    "crates/gx-core",
    "crates/gx-kinds",
    "crates/gx-layout",
    "crates/gx-render-svg",
    "crates/gx-mcp",
    "crates/gx-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/graphium-dev/graphium"

[workspace.dependencies]
gx-core = { path = "crates/gx-core" }
gx-kinds = { path = "crates/gx-kinds" }
gx-layout = { path = "crates/gx-layout" }
gx-render-svg = { path = "crates/gx-render-svg" }
gx-mcp = { path = "crates/gx-mcp" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
schemars = "1.2.3"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "rt", "macros", "io-std", "io-util", "sync", "time", "process", "net"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io", "macros"] }
dagre = "=0.1.2"
rustybuzz = "0.20.1"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
